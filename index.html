<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutCount</title>
<meta name="description" content="CutCount: cut the floating fruit yourself, dare one more cut, let it go before it cracks. The game of the CutCount ASMR videos.">
<style>
  :root { --bg: #17191e; --text: #ecedf0; --muted: #a3a8b3; --accent: #f2774b; --box: #22252c; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px 64px; text-align: center; }
  h1 { font-size: 3rem; line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); margin: 0 0 32px; }
  .links { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .links a { display: block; width: 100%; max-width: 320px; padding: 14px 20px; border-radius: 999px; background: var(--box); color: var(--text); text-decoration: none; font-weight: 600; }
  .links a.main { background: var(--accent); color: #fff; }
  footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Cut<span>Count</span></h1>
  <p class="tag">Cut the floating fruit yourself. Dare one more cut. Let it go before it cracks.</p>
  <div class="links">
    <a class="main" href="https://play.google.com/store/apps/details?id=com.cutcountasmr.game">Get it on Google Play</a>
    <a href="https://www.youtube.com/@cutcountasmr">Watch the videos</a>
    <a href="privacy-policy.html">Privacy policy</a>
  </div>
  <footer>Made by CutCount ASMR · <a href="mailto:cutcountasmr@gmail.com">cutcountasmr@gmail.com</a></footer>
</main>
</body>
</html>
